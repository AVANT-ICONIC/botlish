name: tests (macos arm64)

# EXPLORATORY second version: a census of the whole test suite on a macOS
# arm64 runner with the native backend built, the golden suites on every
# backend, and probes of the native runtime's unsupported paths. Replaced by
# the tiered workflow once the facts are known.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  census:
    name: census (Tcl suite on interp, shard ${{ matrix.shard }}/3)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v5
      - name: Prerequisites
        run: tests/platform/setup-macos.sh "$GITHUB_PATH"
      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native
      - name: Tcl test files of this shard on interp
        env:
          CORE_BACKEND: interp
          SHARD: ${{ matrix.shard }}
        run: |
          set +e
          files=$(cd tests && ls *.test | awk -v s="$SHARD" 'NR % 3 == s' | tr '\n' ' ')
          echo "files: $files"
          start=$(date +%s)
          tclsh9.0 tests/all.tcl -tmpdir "$(mktemp -d)" -file "$files" > census.log 2>&1
          status=$?
          end=$(date +%s)
          echo "exit $status after $((end - start)) s"
          grep -a -E '^(all.tcl:|Files with failing tests:|Test files exiting with errors:|Sourced)' -A3 census.log
          {
            echo "## census shard $SHARD: exit $status, $((end - start)) s"
            echo '```'
            grep -a -E '^[a-z0-9-]+\.test:|^all.tcl:|Files with failing tests|exiting with errors' -A2 census.log | grep -a -v '^--$' | head -300
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -80 census.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: census-shard-${{ matrix.shard }}
          path: census.log
          if-no-files-found: ignore

  golden:
    name: golden suites on every backend (shard ${{ matrix.shard }}/2)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v5
      - name: Prerequisites
        run: tests/platform/setup-macos.sh "$GITHUB_PATH"
      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native
      - name: Golden suites of this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set +e
          suites=$(ls tests/golden/*.bot | awk -v s="$SHARD" 'NR % 2 == s')
          start=$(date +%s)
          tclsh9.0 tests/golden/run.tcl -quiet $suites > golden.log 2>&1
          status=$?
          end=$(date +%s)
          echo "exit $status after $((end - start)) s"
          {
            echo "## golden shard $SHARD: exit $status, $((end - start)) s"
            echo '```'
            grep -a -v -E ' [0-9]+ passed, 0 failed' golden.log | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat golden.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-shard-${{ matrix.shard }}
          path: golden.log
          if-no-files-found: ignore

  probes:
    name: native runtime probes
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Prerequisites
        run: tests/platform/setup-macos.sh "$GITHUB_PATH"
      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native
      - name: Probes
        run: |
          set +e
          bin=native/target/release/botlish-native
          fx=native/tests/fixtures
          p="$RUNNER_TEMP/probes"; mkdir -p "$p"
          probe() { echo "::group::$1"; shift; "$@"; echo "exit status: $?"; echo "::endgroup::"; }
          probe "fib.nir" $bin run $fx/fib.nir
          probe "stack_overflow.ir, 4 MiB stack" env BOTLISH_NATIVE_STACK_BYTES=4194304 $bin run $fx/stack_overflow.ir
          probe "stack_overflow.ir, default stack" $bin run $fx/stack_overflow.ir
          probe "large_frame_overflow.nir, 4 MiB stack" env BOTLISH_NATIVE_STACK_BYTES=4194304 $bin run $fx/large_frame_overflow.nir
          probe "build400.nir under GC stress" env BOTLISH_NATIVE_GC_STRESS=1 $bin run $fx/build400.nir
          probe "loop-count.nir" $bin run $fx/loop-count.nir
          cat > "$p/deep.bot" <<'EOF'
          fn depth(n):
              if n == 0:
                  return 0

              1 + depth(n - 1)

          depth(100000000)
          EOF
          cat > "$p/coroutine.bot" <<'EOF'
          struct Message:
              value: int

          struct Event:
              value: int

          fn deep(base: int, resume Message) -> int:
              message = yield Event {value: base}
              message.value

          fn worker(base: int, resume Message) -> Event:
              x = deep(base)
              message = yield Event {value: x}
              return Event {value: message.value}

          coroutine {step, first} = worker(10)
          second = step(Message {value: 7})
          [first.value, second.value]
          EOF
          probe "deep recursion, cranelift" tclsh9.0 main.tcl -backend cranelift "$p/deep.bot"
          probe "deep recursion, cranelift, 64 MiB stack" env BOTLISH_NATIVE_STACK_BYTES=67108864 tclsh9.0 main.tcl -backend cranelift "$p/deep.bot"
          probe "coroutine, interp" tclsh9.0 main.tcl -backend interp "$p/coroutine.bot"
          probe "coroutine, cranelift" tclsh9.0 main.tcl -backend cranelift "$p/coroutine.bot"
          probe "portable hello (syscalls), cranelift" tclsh9.0 main.tcl -backend cranelift examples/io/hello.bot
          probe "linux::write, cranelift" tclsh9.0 main.tcl -backend cranelift examples/linux/write.bot
          probe "C FFI (Tcl library), cranelift" tclsh9.0 main.tcl -backend cranelift examples/ffi/tcl/tcl.bot
          probe "stdlib examples, cranelift" tclsh9.0 main.tcl -backend cranelift examples/stdlib/*.bot
          probe "stdlib examples, cranelift-generic" tclsh9.0 main.tcl -backend cranelift-generic examples/stdlib/*.bot
          probe "object file" sh -c "echo 'source native/native.tcl; native::object [surface::readProgramFile examples/surface/02-recursion.bot] $p/fib.o' | tclsh9.0; file $p/fib.o; nm $p/fib.o | head -20; otool -l $p/fib.o | grep -A4 LC_BUILD_VERSION"
          probe "cargo test (all targets)" cargo test --release --manifest-path native/Cargo.toml
          probe "cargo test under GC stress" env BOTLISH_NATIVE_GC_STRESS=1 cargo test --release --manifest-path native/Cargo.toml
          probe "codesign of botlish-native" codesign -dv $bin
          probe "botlish-aot-stub" native/target/release/botlish-aot-stub
          probe "ulimit -s" sh -c 'ulimit -s; sysctl kern.stack_size 2>/dev/null; sysctl -a 2>/dev/null | grep -i -E "stack|maxproc" | head'
