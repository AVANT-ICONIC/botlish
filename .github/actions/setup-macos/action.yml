name: Install the macOS prerequisites
description: >
  The macOS counterpart of .devcontainer/setup.sh for the macOS arm64
  workflow (MACOS-AARCH64-PORT-AUDIT.md, section 16): runs
  tests/platform/setup-macos.sh -- this repository's baseline Tcl 9.0.1,
  built once from its pinned source release and cached here, and the
  stable Rust toolchain -- and puts both on PATH for the job's later
  steps.

runs:
  using: composite
  steps:
    # The build's inputs are the script (version, checksum, flags) and the
    # runner image's toolchain: the key holds the first; an image change
    # that breaks the cached build shows as a failing Tcl check.
    - name: Cache the Tcl 9.0.1 build
      uses: actions/cache@v4
      with:
        path: ~/.cache/botlish/tcl-9.0.1
        key: tcl-9.0.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/platform/setup-macos.sh') }}

    - name: Install Tcl 9.0.1 and stable Rust
      shell: bash
      run: tests/platform/setup-macos.sh "$GITHUB_PATH"
